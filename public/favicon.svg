<?xml version="1.0" encoding="UTF-8"?>
<!-- dot-connect app icon (source). A TODO list drawn as dots and lines:
     three rows, each a node (dot) with its text line; the nodes are joined
     by a connector (the "connect" in dot-connect). The first two rows are
     done (filled node with a check), the last is pending (ring). Colors are
     the UI's own palette (index.html: bg #0e1116 / raise #161b22 / accent
     #3fb6a8). The rounded square sits inside the 1024 canvas with the
     ~10% margin macOS expects for app icons.

     Regenerate every platform size with (from desktop/):
       bun x tauri icon src-tauri/icons/icon.svg -o src-tauri/icons -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232d"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="107" y="107" width="810" height="810" rx="177" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="14"/>

  <!-- connector between the nodes, behind everything -->
  <path d="M360 356 V668" fill="none" stroke="#3fb6a8" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round"/>

  <!-- text lines -->
  <g fill="none" stroke="#e2e8f0" stroke-width="48" stroke-linecap="round">
    <path d="M476 356 H728"/>
    <path d="M476 512 H668"/>
    <path d="M476 668 H716" stroke-opacity="0.38"/>
  </g>

  <!-- nodes -->
  <circle cx="360" cy="356" r="58" fill="#3fb6a8"/>
  <path d="M332 357 L352 377 L390 335" fill="none" stroke="#08201d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="360" cy="512" r="58" fill="#3fb6a8"/>
  <path d="M332 513 L352 533 L390 491" fill="none" stroke="#08201d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="360" cy="668" r="50" fill="#0c0f14" stroke="#3fb6a8" stroke-width="16"/>
</svg>
